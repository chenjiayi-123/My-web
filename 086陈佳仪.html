<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-size: 18px;
            font-weight: 400;
            color: #000000;
            list-style-type: none;
            text-decoration: none;
            box-sizing: border-box;
            font-family: "微软雅黑";
            line-height: 60px;

        }

        body {
            background-image: url(https://i3.hunantv.com/p1/20150601/181703520C.jpg);
            background-size: cover;
            background-repeat: no-repeat;
        }

        .yijihezi {
            width: 160px;
            height: 300px;
            margin: 54px 0 0 50px;
        }

        .yijiliebiao {
            width: 160px;
        }

        .yijiliebiao>li {
            width: 160px;
            height: 60px;
            float: none;
            position: relative;
        }
         li {
            display: flex;
            justify-content: center;
        }
        .erjihezi {
            position: absolute;
            top: 0;
            left: 160px;
            background-color: rgb(255, 255, 255);
            padding: 0 0;
            width: 0;
            height: 140px;
            overflow: hidden;
            transition: all 300ms linear;
        }
        .huaqiangugaikuang,
        .juesejieshao {
            margin-bottom: 70px;
        }
        .erjihezi a {
            color: black;
            font-size: 16px;
            line-height: 40px;
        }

        .erjiliebiao>li {
            width: 120px;
            height: 40px;
        }
         .yijiliebiao>li:hover .erjihezi {
            width: 120px;
            padding: 10px 0;
        }
         .yijiliebiao>li>a::after {
            content: '';
            position: absolute;
            left: 0;
            width: 160px;
            height: 0;
            background-color: #bb1313;
            z-index: -1;
            transition: all 300ms linear;
        }

        .yijiliebiao>li:hover a::after {
            height: 60px;
        }

    </style>
</head>

<body>
    <div class="yijihezi">
        <ul class="yijiliebiao">
            <li class="huaqiangugaikuang">
                <a href="#">《花千骨》概况</a>
                <div class="erjihezi">
                    <ul class="erjiliebiao">
                        <li>
                            <a href="#">剧情介绍</a>
                        </li>
                        <li>
                            <a href="#">播出信息</a>
                        </li>
                        <li>
                            <a href="#">获奖记录</a>
                        </li>
                    </ul>
                </div>
            </li>
            <li class="juesejieshao">
                <a href="#">角色介绍</a>
                <div class="erjihezi">
                    <ul class="erjiliebiao">
                        <li>
                            <a href="#">花千骨</a>
                        </li>
                        <li>
                            <a href="#">白子画</a>
                        </li>
                        <li>
                            <a href="#">东方彧卿</a>
                        </li>
                    </ul>
                </div>
            </li>
            <li class="yanzhiyaunbiao">
                <a href="#">演职员表</a>
                <div class="erjihezi">
                    <ul class="erjiliebiao">
                        <li>
                            <a href="#">赵丽颖</a>
                        </li>
                        <li>
                            <a href="#">霍建华</a>
                        </li>
                        <li>
                            <a href="#">张丹峰</a>
                        </li>
                    </ul>
                </div>
            </li>
        </ul>
    </div>
</body>

</html>
